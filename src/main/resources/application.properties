spring.application.name=rtbc-orders-api

# Persistencia: H2 en memoria (ADR-003)
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Sin consultas fuera de la transacción del caso de uso
spring.jpa.open-in-view=false

# JSON: decimales siempre en notación plana (200000, nunca 2E+5)
spring.jackson.write.write-bigdecimal-as-plain=true
# Una cantidad decimal (1.5) es un error del cliente, no se trunca a 1
spring.jackson.deserialization.accept-float-as-int=false

# R06: las respuestas de error nunca incluyen trazas, mensajes de excepción ni errores de binding
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
