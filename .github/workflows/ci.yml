name: CI

# Pipeline completo (ADR-022):
#   build ──┬── mutation ───┐
#           ├── acceptance ─┼── publish (solo push a main y tags v*)
#           └── sonar ──────┘
# Quality gates: pruebas fallidas, cobertura < 80 % (JaCoCo), mutation score < 70 % (PIT),
# Karate contra el contenedor y quality gate de SonarCloud.
# Actions fijadas por SHA de commit (cadena de suministro, regla S7637 de SonarCloud); la versión va en el comentario.
# Solo PR hacia main y push a main/tags: los commits rojos intermedios del ciclo TDD no disparan el pipeline.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En un PR solo importa el último commit; en main se deja terminar cada ejecución (publica imágenes)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Maven 3.9+ agrega estos argumentos a cada ejecución de ./mvnw
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, pruebas unitarias e integración y cobertura (umbral 80 %)
        run: ./mvnw verify

      - name: Pruebas en orden inverso (detecta dependencias entre pruebas)
        run: ./mvnw surefire:test -Dsurefire.runOrder=reversealphabetical

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "Sin reporte de cobertura" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          awk -F, 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
            END {
              print "### Cobertura (JaCoCo, umbral 80 %)";
              print "| Métrica | Valor |"; print "|---|---|";
              printf "| Líneas | %.1f %% (%d/%d) |\n", 100*lc/(lc+lm), lc, lc+lm;
              printf "| Ramas | %.1f %% (%d/%d) |\n", 100*bc/(bc+bm), bc, bc+bm
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-pruebas
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: mutation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Mutation testing con PIT (umbral 70 %)
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Resumen de mutación
        if: always()
        run: |
          xml=target/pit-reports/mutations.xml
          if [ ! -f "$xml" ]; then echo "Sin reporte de mutación" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          total=$(grep -o '<mutation ' "$xml" | wc -l)
          detected=$(grep -o "detected='true'" "$xml" | wc -l)
          {
            echo "### Mutation testing (PIT STRONGER, umbral 70 %)"
            echo "| Métrica | Valor |"; echo "|---|---|"
            echo "| Mutantes detectados | $detected/$total |"
            awk -v d="$detected" -v t="$total" 'BEGIN { if (t > 0) printf "| Mutation score | %.1f %% |\n", 100*d/t }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacion-pit
          path: target/pit-reports/
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    name: acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: challenge-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar el contenedor (espera a healthy)
        run: docker compose up -d --wait --no-build api

      - name: Karate contra el contenedor (ADR-012)
        run: ./mvnw verify -Pacceptance -DskipUnitTests=true -Dacceptance.skipAppStart=true -Dkarate.env=docker

      - name: Resumen de aceptación
        if: always()
        run: |
          json=target/karate-reports/karate-summary-json.txt
          if [ ! -f "$json" ]; then echo "Sin reporte de Karate" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          passed=$(grep -oE '"scenariosPassed":[0-9]+' "$json" | cut -d: -f2)
          failed=$(grep -oE '"scenariosfailed":[0-9]+' "$json" | cut -d: -f2)
          {
            echo "### Pruebas de aceptación (Karate contra el contenedor)"
            echo "| Escenarios aprobados | Escenarios fallidos |"; echo "|---|---|"
            echo "| $passed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs del contenedor
        if: always()
        run: |
          mkdir -p target
          docker compose logs --no-color api > target/logs-contenedor.txt || true

      - name: Publicar reporte de Karate y logs del contenedor
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aceptacion-karate
          path: |
            target/karate-reports/
            target/logs-contenedor.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Detener el contenedor
        if: always()
        run: docker compose down

  sonar:
    name: sonar
    needs: build
    # Los PR desde forks no reciben secretos: el análisis solo corre para ramas de este repositorio.
    # En tags no se analiza: el mismo commit ya se analizó en main, y SonarCloud registraría el tag como otra rama.
    if: >-
      github.ref_type != 'tag' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (historial completo para el análisis de código nuevo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Análisis de SonarCloud y quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

  publish:
    name: publish
    needs: [build, mutation, acceptance, sonar]
    # Publica si ningún job falló; sonar se omite en tags y eso no debe impedir publicar la versión
    if: github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Resumen de publicación
        run: |
          {
            echo "### Imagen publicada en GHCR"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
